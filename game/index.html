<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CanonOS - Department of Canonical Restoration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="desktop">
  <div id="icons"></div>
  <div id="windows"></div>
</div>
<div id="taskbar">
  <div id="start"><img src="assets/seal/emblem16.png" alt="">CanonOS</div>
  <div id="tasks"></div>
  <div id="tray"><span id="tray-mail"></span><span id="tray-clock"></span></div>
</div>
<div id="splash">
  <div class="box">
    <img src="assets/seal/medallion.png" alt="" class="emblem">
    <div class="name">CanonOS</div>
    <div class="dept">Department of Canonical Restoration</div>
    <div class="desk">Desk 14 workstation</div>
    <button id="logon">Log on</button>
    <div id="splash-status"></div>
  </div>
</div>
<div id="debug" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
